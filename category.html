<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category - MLF News 24</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Odia:wght@400;700&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="breaking-bar">
  <span class="breaking-label">🔴 BREAKING</span>
  <div class="ticker-wrap"><div class="ticker" id="breakingTicker"></div></div>
</div>

<div id="site-header"></div>

<div class="category-page">
  <div class="category-header">
    <h1 id="catTitle">All News</h1>
    <p style="color:var(--gray);font-size:14px;margin-top:8px">Latest news in this category</p>
  </div>
  <div class="category-layout">
    <div>
      <div class="stories-grid" id="catArticlesGrid"></div>
      <div class="pagination" id="pagination">
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn">→</button>
      </div>
    </div>
    <aside>
      <div class="sidebar-widget trending">
        <h3>🔥 Trending</h3>
        <ol id="trendingList"></ol>
      </div>
    </aside>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
