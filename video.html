<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video News - MLF News 24</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Odia:wght@400;700&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
.video-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.video-modal-inner{width:80%;max-width:900px}
.video-modal-title{color:white;font-family:'Playfair Display',serif;font-size:22px;margin-bottom:16px}
.video-modal iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:8px}
.modal-close{position:absolute;top:24px;right:32px;color:white;font-size:32px;cursor:pointer;background:none;border:none;line-height:1}
</style>
</head>
<body>

<div class="breaking-bar">
  <span class="breaking-label">🔴 BREAKING</span>
  <div class="ticker-wrap"><div class="ticker" id="breakingTicker"></div></div>
</div>

<div id="site-header"></div>

<div class="video-page">
  <h1 class="section-title" style="margin-bottom:32px"><span>📺 Video News / ଭିଡ଼ିଓ ସମାଚାର</span></h1>
  <div class="video-grid" id="videoPageGrid"></div>
</div>

<div class="video-modal" id="videoModal">
  <button class="modal-close" onclick="closeVideoModal()">✕</button>
  <div class="video-modal-inner">
    <div class="video-modal-title" id="videoModalTitle"></div>
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>
</div>

<div id="site-header"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
