<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLF News 24 - ବିଶ୍ୱସ୍ତ ଓଡ଼ିଆ ସମାଚାର</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Odia:wght@400;700&family=Baloo+Chhanda+2:wght@400;700&family=Sarala:wght@400;700&family=Tiro+Oriya&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<!-- Hero Section -->
<section class="hero-section">
  <div class="hero-slider" id="heroSlider"></div>
  <div class="hero-dots" id="heroDots"></div>
</section>

<!-- Main Content Grid -->
<main class="main-grid">
  <section class="top-stories">
    <h2 class="section-title"><span>Top Stories</span></h2>
    <div class="stories-grid" id="topStoriesGrid"></div>
  </section>

  <aside class="sidebar">
    <div class="sidebar-widget trending">
      <h3>🔥 Trending</h3>
      <ol id="trendingList"></ol>
    </div>
      <div class="sidebar-widget ads-widget" id="sidebarAd">
      <div class="ad-slide active">Advertisement</div>
      <div class="ad-slide">Advertisement</div>
      <div class="ad-slide">Advertisement</div>
      Advertisement
    </div>
    <div class="sidebar-widget weather-widget">
      <h3>🌤 ପାଣିପାଗ / Weather</h3>
      <div class="weather-info">
  <div class="weather-icon" id="weatherIcon">⛅</div>
  <div class="weather-city" id="weatherCity">Loading...</div>
  <div class="weather-temp" id="weatherTemp">--°C</div>
  <div class="weather-desc" id="weatherDesc">--</div>
  <div class="weather-extra">
    <span>💧 <strong id="weatherHumidity">--%</strong> Humidity</span>
    <span>🌡 <strong id="weatherFeels">--°C</strong> Feels like</span>
    <span>💨 <strong id="weatherWind">-- km/h</strong> Wind</span>
    </div>
    </div>
  </aside>
</main>

<!-- Category Sections -->
<div class="category-sections" id="categorySections"></div>

<!-- Video Section -->
<section class="video-section">
  <h2 class="section-title"><span>📺 Video News</span></h2>
  <div class="video-grid" id="homeVideoGrid"></div>
  <a href="video.html" class="see-all-btn">All Videos →</a>
</section>

<!-- Ad Banner -->
<div class="ad-banner" id="bottomAd"></div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
