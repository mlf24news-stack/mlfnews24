<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article - MLF News 24</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Odia:wght@400;700&family=Baloo+Chhanda+2:wght@400;700&family=Sarala:wght@400;700&family=Tiro+Oriya&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>
  
<div style="max-width:1280px;margin:0 auto;padding:20px 40px;">
  <a href="javascript:history.back()" style="color:var(--red);text-decoration:none;font-size:13px;">← Back</a>
</div>

<div class="article-page">
  <div class="article-header">
    <span class="article-cat" id="artCategory"></span>
    <h1 class="article-title" id="artTitle"></h1>
    <div class="article-meta">
      <span class="article-reporter" id="artReporter"></span>
      <span id="artDate"></span>
      <span id="artViews"></span>
    </div>
  </div>
  <div class="article-hero-img" id="artHeroImg"></div>
  <div class="article-body" id="artBody"></div>

  <div class="share-bar">
    <span style="font-weight:700;font-size:14px;">Share:</span>
    <button class="share-btn share-fb" onclick="share('fb')">📘 Facebook</button>
    <button class="share-btn share-tw" onclick="share('tw')">🐦 Twitter</button>
    <button class="share-btn share-wa" onclick="share('wa')">💬 WhatsApp</button>
  </div>
</div>

<div style="max-width:860px;margin:40px auto;padding:0 40px;">
  <h2 class="section-title"><span>Related News / ସମ୍ବନ୍ଧିତ ଖବର</span></h2>
  <div class="stories-grid" id="relatedGrid"></div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
<script>
function share(platform) {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.getElementById('artTitle').textContent);
  const urls = {
    fb: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
    tw: `https://twitter.com/intent/tweet?url=${url}&text=${title}`,
    wa: `https://wa.me/?text=${title}%20${url}`
  };
  window.open(urls[platform], '_blank');
}
</script>
</body>
</html>
